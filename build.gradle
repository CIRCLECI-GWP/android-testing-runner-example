buildscript {
    ext.navigationVersion = '2.10.2'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9 includes built-in Kotlin support, so the Kotlin Gradle plugin is no longer declared here
        classpath 'com.android.tools.build:gradle:9.5.0'
        // Provides the com.android.legacy-kapt plugin
        classpath 'com.android.tools.build:gradle-kotlin:9.5.0'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

// Define versions in a single place
ext {
    // Sdk and tools
    minSdkVersion = 24
    targetSdkVersion = 36
    compileSdkVersion = 36

    // App dependencies
    androidXTestCoreVersion = '1.7.0'
    androidXTestExtKotlinRunnerVersion = '1.3.0'
    androidXAnnotations = '1.11.0'
    appCompatVersion = '1.8.0'
    archLifecycleVersion = '2.11.0'
    archTestingVersion = '2.2.0'
    cardVersion = '1.0.0'
    coroutinesVersion = '1.11.0'
    dexMakerVersion = '2.28.6'
    espressoVersion = '3.7.0'
    fragmentVersion = '1.9.1'
    fragmentKtxVersion = '1.9.1'
    hamcrestVersion = '1.3'
    junitVersion = '4.13.2'
    materialVersion = '1.14.0'
    mockitoVersion = '5.24.0'
    recyclerViewVersion = '1.4.0'
    swipeRefreshLayoutVersion = '1.2.0'
    drawerLayoutVersion = '1.2.0'
    robolectricVersion = '4.17'
    roomVersion = '2.8.5'
    orchestratorVersion = '1.6.1'
    timberVersion = '5.0.1'
}
