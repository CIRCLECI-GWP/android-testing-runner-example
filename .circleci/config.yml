version: 2.1

orbs:
  android: circleci/android@3.2.0

jobs:
  unit-test:
    executor:
      name: android/android_docker
      tag: 2026.10.1
      resource_class: large
    steps:
      - checkout
      - android/restore_gradle_cache
      - android/restore_build_cache
      - android/run_tests:
          test_command: ./gradlew testDebug
      - android/save_gradle_cache
      - android/save_build_cache
      - run:
          name: Save test results
          command: |
              mkdir -p ~/test-results/junit/
              find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - store_test_results:
          path: ~/test-results
      - store_artifacts:
          path: ~/test-results/junit

  runner-test:
    machine: true
    # Replace with your own runner's <namespace>/<resource-class>
    resource_class: zmarkan-demos-namespace/local-mac-runner
    environment:
      # Replace with the JDK 17 and Android SDK paths on your runner machine
      JAVA_HOME: /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
      ANDROID_HOME: /Users/<your-username>/Library/Android/sdk
    steps:
      - checkout
      - run:
          name: Run connected check on local runner
          command: |
            ./gradlew connectedDebugAndroidTest

  release-build:
    executor:
      name: android/android_docker
      tag: 2026.10.1
      resource_class: large
    steps:
      - checkout
      - android/restore_gradle_cache
      - android/restore_build_cache
      - run:
          name: Assemble release build
          command: |
            ./gradlew assembleRelease
      - store_artifacts:
          path: app/build/outputs/apk/release/app-release.apk

workflows:
  test-and-build:
    jobs:
      - unit-test
      - runner-test
      - release-build:
          requires:
            - unit-test
            - runner-test
          filters:
            branches:
              only: main # Commits to main branch

